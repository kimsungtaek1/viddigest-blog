<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VidDigest가 무료 공개 RSS로 자동 수집하는 뉴스레터 보관함">
    <link rel="canonical" href="https://viddigest-blog.pages.dev/newsletters/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="뉴스레터 - VidDigest">
    <meta property="og:description" content="자기계발, 사업, 법률, 컴퓨터 사이언스, 양자컴퓨터, 제약 뉴스를 한곳에서 확인하세요.">
    <meta property="og:url" content="https://viddigest-blog.pages.dev/newsletters/">
    <title>뉴스레터 - VidDigest</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="newsletters.css">
</head>
<body>
    <header class="header newsletter-site-header">
        <h1><a href="../">VidDigest</a></h1>
        <div class="meta">
            <span>뉴스레터 보관함</span>
            <span>무료 공개 RSS 자동 수집</span>
        </div>
        <nav class="nav-links" aria-label="주요 메뉴">
            <a href="../" class="nav-link">블로그</a>
            <a href="./" class="nav-link active" aria-current="page">뉴스레터</a>
        </nav>
    </header>

    <main class="newsletter-shell">
        <section class="newsletter-hero" aria-labelledby="newsletter-title">
            <div>
                <p class="newsletter-eyebrow">AUTOMATIC READING LIST</p>
                <h2 id="newsletter-title">새 글만 모으고,<br>원문은 그대로 연결합니다.</h2>
                <p class="newsletter-intro">기존 VidDigest 블로그 글과 완전히 분리된 공간입니다. 자기계발·사업·법률·컴퓨터 사이언스·양자컴퓨터·제약까지 모으며, 날씨·인사·부고 같은 잡음은 제외합니다.</p>
            </div>
            <dl class="newsletter-stats" aria-label="수집 현황">
                <div><dt>수집 글</dt><dd id="newsletter-item-count">—</dd></div>
                <div><dt>구독 소스</dt><dd id="newsletter-feed-count">—</dd></div>
                <div><dt>최근 갱신</dt><dd id="newsletter-updated-at">—</dd></div>
            </dl>
        </section>

        <section class="newsletter-toolbar" aria-label="뉴스레터 검색과 필터">
            <label class="newsletter-search">
                <span>검색</span>
                <input id="newsletter-search" type="search" placeholder="제목, 설명, 카테고리, 발행처 검색" autocomplete="off">
            </label>
            <label class="newsletter-category-filter">
                <span>카테고리</span>
                <select id="newsletter-category">
                    <option value="">전체 카테고리</option>
                </select>
            </label>
            <label class="newsletter-language-filter">
                <span>언어</span>
                <select id="newsletter-language">
                    <option value="ko-first" selected>한국어 먼저</option>
                    <option value="ko">한국어만</option>
                    <option value="en">영어만</option>
                    <option value="">전체 최신순</option>
                </select>
            </label>
            <label class="newsletter-source-filter">
                <span>발행처</span>
                <select id="newsletter-source">
                    <option value="">전체 발행처</option>
                </select>
            </label>
        </section>

        <div class="newsletter-source-strip" id="newsletter-source-strip" aria-label="수집 중인 발행처"></div>
        <p class="newsletter-status" id="newsletter-status" role="status" aria-live="polite">뉴스레터를 불러오는 중입니다.</p>
        <section class="newsletter-list" id="newsletter-list" aria-label="수집한 뉴스레터 글"></section>

        <noscript>
            <p class="newsletter-error">뉴스레터 목록을 보려면 JavaScript를 켜주세요.</p>
        </noscript>
    </main>

    <footer class="footer">Korean + English public RSS · No paid API · Generated by VidDigest</footer>
    <script src="newsletters.js"></script>
</body>
</html>
