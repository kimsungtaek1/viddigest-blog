<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VidDigest - 마크다운 포스트">
    <title>마크다운 포스트 - VidDigest</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="header">
        <h1><a href="../">VidDigest</a></h1>
        <div class="meta">
            <span>마크다운 포스트</span>
        </div>
        <div class="nav-links">
            <a href="../" class="nav-link">전체 글 보기</a>
        </div>
    </div>
    <div class="container">
        <div class="post-list" id="post-list"></div>
        <div class="footer">
            Generated by VidDigest
        </div>
    </div>
    <script>
    (function() {
        fetch('../index.html')
            .then(function(res) { return res.text(); })
            .then(function(html) {
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');
                var cards = doc.querySelectorAll('.post-card');
                var list = document.getElementById('post-list');
                var count = 0;

                cards.forEach(function(card) {
                    var tags = card.getAttribute('data-tags') || '';
                    if (tags.indexOf('마크다운') === -1) return;

                    var clone = card.cloneNode(true);
                    var href = clone.getAttribute('href');
                    if (href && href.indexOf('../') !== 0) {
                        clone.setAttribute('href', '../' + href);
                    }
                    list.appendChild(clone);
                    count++;
                });

                if (count === 0) {
                    list.innerHTML = '<p style="text-align:center;color:#999;padding:60px 0;">마크다운 포스트가 없습니다.</p>';
                }
            });
    })();
    </script>
</body>
</html>
