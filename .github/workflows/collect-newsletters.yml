name: Collect newsletters

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/newsletter-feeds.json
      - scripts/collect-newsletters.py
      - scripts/test_collect_newsletters.py
      - .github/workflows/collect-newsletters.yml

concurrency:
  group: newsletter-collector
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify collector
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/test_collect_newsletters.py

      - name: Collect public RSS and Atom feeds
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/collect-newsletters.py

      - name: Commit newsletter snapshot
        id: commit
        run: |
          if git diff --quiet -- public/newsletters/newsletters.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new newsletter items."
            exit 0
          fi

          git config user.name "VidDigest Newsletter Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/newsletters/newsletters.json
          git diff --cached --check
          git commit -m "Update newsletter feed"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not push newsletter update after 3 attempts." >&2
              exit 1
            fi
            git pull --rebase origin main
          done

      - name: Wait for pushed snapshot ref
        if: steps.commit.outputs.changed == 'true'
        run: |
          expected_sha="${{ steps.commit.outputs.commit_sha }}"
          for attempt in $(seq 1 15); do
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha 2>/dev/null || true)"
            if [ "$current_sha" = "$expected_sha" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "main did not expose pushed snapshot $expected_sha in time." >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy updated newsletter page
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
