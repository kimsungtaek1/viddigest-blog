name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - public/**
      - scripts/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public assets
        run: scripts/prepare-public-assets.sh
        env:
          ASSET_VERSION: ${{ github.sha }}

      - name: Validate generated shared assets
        run: |
          required_css=(
            "--reader-body-font-size"
            "body[data-post-slug] .container > p"
            ".toc ul"
            "list-style: none"
            ".reader-font-control"
            ".reader-page-control"
            ".admin-control"
            ".admin-post-actions"
          )
          required_js=(
            "viddigest-reader-font-size"
            "ensureNewsletterNavigation"
            "createReaderPageControl"
            "initReaderControls(body)"
            "markKeyContentSections(body)"
            "/api/auth/me"
            "renderPostListAdminActions"
            "/api/posts/"
          )

          for token in "${required_css[@]}"; do
            grep -Fq -- "$token" public/css/style.css || {
              echo "Missing CSS token: $token" >&2
              exit 1
            }
          done

          for token in "${required_js[@]}"; do
            grep -Fq -- "$token" public/js/main.js || {
              echo "Missing JS token: $token" >&2
              exit 1
            }
          done

          newsletter_files=(
            "public/newsletters/index.html"
            "public/newsletters/newsletters.css"
            "public/newsletters/newsletters.js"
            "public/newsletters/newsletters.json"
          )
          for file in "${newsletter_files[@]}"; do
            test -s "$file" || {
              echo "Missing newsletter asset: $file" >&2
              exit 1
            }
          done
          grep -Fq "fetch('./newsletters.json'" public/newsletters/newsletters.js
          if grep -R -Fq "posts.json" public/newsletters; then
            echo "Newsletter assets must not read or contain posts.json." >&2
            exit 1
          fi
          jq -e '.version == 1
            and (.feeds | type == "array")
            and (.items | type == "array")
            and all(.feeds[]; (.language == "ko" or .language == "en"))
            and all(.feeds[]; (.category | type == "string") and (.category | length > 0))
            and all(.items[]; (.language == "ko" or .language == "en"))
            and all(.items[]; (.category | type == "string") and (.category | length > 0))
            and (["자기계발", "사업", "법률", "컴퓨터 사이언스", "양자컴퓨터", "제약"] - [.feeds[].category] | length == 0)
            and (([.items[].url] | length) == ([.items[].url] | unique | length))' \
            public/newsletters/newsletters.json >/dev/null

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: viddigest-blog
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
