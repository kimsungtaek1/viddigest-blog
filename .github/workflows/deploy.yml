name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - public/**
      - scripts/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public assets
        run: scripts/prepare-public-assets.sh
        env:
          ASSET_VERSION: ${{ github.sha }}

      - name: Validate generated reader assets
        run: |
          required_css=(
            "--reader-body-font-size"
            "body[data-post-slug] .container > p"
            ".toc ul"
            "list-style: none"
            ".reader-font-control"
            ".reader-page-control"
          )
          required_js=(
            "viddigest-reader-font-size"
            "createReaderPageControl"
            "initReaderControls(body)"
            "markKeyContentSections(body)"
          )

          for token in "${required_css[@]}"; do
            grep -Fq -- "$token" public/css/style.css || {
              echo "Missing CSS token: $token" >&2
              exit 1
            }
          done

          for token in "${required_js[@]}"; do
            grep -Fq -- "$token" public/js/main.js || {
              echo "Missing JS token: $token" >&2
              exit 1
            }
          done

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: viddigest-blog
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
